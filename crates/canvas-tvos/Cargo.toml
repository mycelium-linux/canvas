[package]
name = "canvas-tvos"
version = "0.1.0"
edition = "2024"
license = "LicenseRef-Proprietary"

# Independent Apple packaging; does not change the desktop workspace toolchain.
[workspace]

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
canvas-core = { path = "../canvas-core" }
canvas-workspace = { path = "../canvas-workspace" }
fpl-gfx = { path = "../../../gfx", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.dev]
debug = 0
incremental = false
