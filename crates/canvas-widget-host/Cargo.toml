[package]
name = "canvas-widget-host"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false
description = "Independent bounded Lua composition and Canvas presentation delivery"

# Intentionally independently buildable: no compositor/GUI dependency.
[workspace]

[features]
default = ["luau"]
luau = []

[dependencies]
mlua = { version = "=0.12.2", features = ["serialize", "luau", "vendored"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
