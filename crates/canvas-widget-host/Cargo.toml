[package]
name = "canvas-widget-host"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false
description = "Independent bounded Lua composition and Canvas presentation delivery"

# Intentionally independently buildable: no compositor/GUI dependency.
[workspace]

[features]
default = ["luau"]
luau = []
owner-http = ["dep:reqwest"]

[dependencies]
mlua = { version = "=0.12.2", features = ["serialize", "luau", "vendored"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
sha2 = "0.10"
unibus = { git = "ssh://git@github.com/FuturePresentLabs/unibus.git", rev = "318424cdf91c6eebdd2024b779771c225e83025c" }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"], optional = true }

[[bin]]
name = "canvas-first-party"
path = "src/bin/canvas-first-party.rs"
required-features = ["owner-http"]
