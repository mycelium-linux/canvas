[package]
name = "dock-linux"
version = "0.1.0"
edition = "2021"

[dependencies]
dock-core = { path = "../dock-core" }
serde_json = "1"
libc = "0.2"
base64 = "0.22"
wayland-client = "0.31"
wayland-protocols-wlr = { version = "0.3", features = ["client"] }

serde = { version = "1", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json"] }
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "net", "signal"] }
rmcp = { version = "3.2", default-features = false, features = ["server", "transport-streamable-http-server"] }
subtle = "2.6"
