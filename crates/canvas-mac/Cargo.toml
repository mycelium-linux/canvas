[package]
name = "canvas-mac"
version = "0.1.0"
edition = "2021"

[dependencies]
canvas-core = { path = "../canvas-core" }
canvas = { path = "../canvas" }
iced = { version = "0.14", default-features = false, features = ["tiny-skia", "tokio", "image-without-codecs", "markdown"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
canvas-control = { path = "../canvas-control" }
libc = "0.2"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png"] }
url = "2"
sha2 = "0.10"
rmcp = { version = "3.2", default-features = false, features = ["server", "transport-io", "transport-streamable-http-server"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "signal"] }
axum = "0.8"

[dev-dependencies]
iced_runtime = "0.14"
futures = { version = "0.3", features = ["executor"] }
