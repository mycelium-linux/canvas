[package]
name = "canvas-tardy-tv"
version = "0.1.0"
edition = "2024"
license = "LicenseRef-Proprietary"

# Independently deployable presentation adapter, not part of Android JNI.
[workspace]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
chrono = { version = "0.4", default-features = false, features = ["std"] }
fpl-gfx = { path = "../../../gfx", default-features = false }
