[package]
name = "canvas-widgets"
version.workspace = true
edition.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
canvas-core.workspace = true
fpl-gfx = { workspace = true }
coherence-native = { workspace = true, optional = true }
iced = { version = "0.14", default-features = false, features = ["advanced", "wgpu", "canvas", "image-without-codecs", "tokio"], optional = true }
# Only for callers that publish these types over a schema-carrying protocol (MCP).
schemars = { version = "1", optional = true }
# Local broken-down time for the Clock widget, mirroring canvas's own
# `hud::now_local` so the wall clock and the diagnostics HUD agree.
libc = { version = "0.2", optional = true }
# WASM runtime for kroak CDG renderer
wasmtime = { version = "24", optional = true, features = ["component-model"] }
# Iced wgpu for hyperspace shader rendering
iced_wgpu = { version = "0.14", optional = true }
bytemuck = { version = "1", optional = true }
image = { version = "0.25", default-features = false, features = ["png"], optional = true }
sha2 = { version = "0.10", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
wasm-bindgen = "0.2"

[features]
default = []
live = ["dep:iced", "dep:libc", "dep:coherence-native", "fpl-gfx/wgpu", "dep:iced_wgpu", "dep:bytemuck", "dep:image", "dep:sha2"]
schema = ["dep:schemars"]

[dev-dependencies]
pollster = "0.4"
