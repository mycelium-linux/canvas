[package]
name = "canvas-widgets"
version.workspace = true
edition.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
canvas-core.workspace = true
iced = { version = "0.14", default-features = false, features = ["wgpu", "canvas", "tokio"], optional = true }
# Only for callers that publish these types over a schema-carrying protocol (MCP).
schemars = { version = "1", optional = true }
# Local broken-down time for the Clock widget, mirroring canvas's own
# `hud::now_local` so the wall clock and the diagnostics HUD agree.
libc = { version = "0.2", optional = true }

[features]
default = []
live = ["dep:iced", "dep:libc"]
schema = ["dep:schemars"]
