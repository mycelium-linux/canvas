[package]
name = "canvas-model-host"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Theme-native GPU model renderer and Canvas video producer"

[dependencies]
anyhow.workspace = true
bytemuck = { version = "1.24", features = ["derive"] }
canvas-core.workspace = true
fpl-gfx = { workspace = true, features = ["wgpu"] }
glam = { version = "0.30", features = ["bytemuck"] }
mlua = { version = "0.12.1", features = ["luau", "serialize"] }
pollster = "0.4"
serde.workspace = true
serde_json.workspace = true
stl_io = "0.8"
wgpu = "27"
wasmtime = { version = "34", features = ["cranelift"] }

[features]
default = []
# S1 BLE seam. Off by default: `cargo test -p canvas-model-host` with the feature
# off must stay green, and a host that never grants `soil:ble.*` must not carry
# the import-linking code at all. Component-model support is what the linker and
# the fixture Spore path need; wasmtime enables it by default today, but the gate
# is stated here so the dependency is explicit rather than incidental.
soil-ble = ["wasmtime/component-model"]

[lib]
name = "canvas_model_host"
path = "src/lib.rs"

[[bin]]
name = "canvas-model-host"
path = "src/main.rs"

[dev-dependencies]
tempfile.workspace = true
wat = "1"
wit-parser = "0.215"
