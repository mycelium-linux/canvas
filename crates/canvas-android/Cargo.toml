[package]
name = "canvas-android"
version = "0.1.0"
edition = "2024"
license = "LicenseRef-Proprietary"

# Android packaging is independent of the compositor workspace/toolchain.
[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
android-native-video = ["dep:jni"]

[dependencies]
url = "2"

[target.'cfg(target_os = "android")'.dependencies]
jni = { version = "0.21", optional = true }
