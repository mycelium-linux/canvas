[package]
name = "canvas-android"
version = "0.1.0"
edition = "2024"
license = "LicenseRef-Proprietary"

# Android packaging is independent of the compositor workspace/toolchain.
[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
android-native-video = ["dep:jni", "shared-workspaces", "dep:getrandom", "dep:subtle"]
shared-workspaces = ["dep:canvas-core", "dep:canvas-workspace", "dep:serde_json", "dep:sha2"]

[dependencies]
url = "2"
canvas-core = { path = "../canvas-core", optional = true }
canvas-workspace = { path = "../canvas-workspace", optional = true }
serde_json = { version = "1", optional = true }
getrandom = { version = "0.3", optional = true }
subtle = { version = "2", optional = true }
sha2 = { version = "0.10", optional = true }

[target.'cfg(target_os = "android")'.dependencies]
jni = { version = "0.21", optional = true }

[[bin]]
name = "canvas-tvctl"
path = "src/bin/canvas-tvctl.rs"
required-features = ["shared-workspaces"]
