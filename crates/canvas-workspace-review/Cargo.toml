[package]
name = "canvas-workspace-review"
version = "0.1.0"
edition = "2024"
license = "LicenseRef-Proprietary"
[workspace]
[dependencies]
canvas-workspace-ui = { path = "../canvas-workspace-ui" }
coherence-native = { path = "../../vendor/coherence-native", features = ["egui"] }
egui = "=0.33.3"
