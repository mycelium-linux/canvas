[package]
name = "canvas-web"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
canvas-core.workspace = true
# `webgl` is the browser backend; iced selects it for wasm while native keeps
# wgpu. The same application, scene renderer and message type run on both.
iced = { version = "0.14", default-features = false, features = ["wgpu", "webgl", "fira-sans", "tiny-skia", "canvas", "thread-pool"] }
serde.workspace = true
serde_json.workspace = true
toml = "0.8"
wasm-bindgen = "0.2"

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "0.1"
js-sys = "0.3"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["CustomEvent", "CustomEventInit", "Document", "Element", "EventTarget", "Location", "Response", "Window"] }
