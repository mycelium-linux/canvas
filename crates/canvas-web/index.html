<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#020a11" />
    <title>Canvas Web · LoD Demo</title>
    <link data-trunk rel="rust" data-wasm-opt="z" />
    <style>
      html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #020a11; }
      canvas { width: 100% !important; height: 100% !important; display: block; }
      #boot-status { box-sizing: border-box; position: fixed; z-index: 10; inset: auto 12px 12px 12px; display: flex; align-items: center; gap: .65rem; padding: .65rem .8rem; color: #dcf9ff; font: 11px ui-monospace, monospace; letter-spacing: .04em; background: rgba(2,10,17,.94); border: 1px solid #13485b; pointer-events: none; }
      #boot-status strong { color: #31e6ff; font-size: 18px; }
      #boot-status[data-state="ready"] { opacity: 0; transition: opacity 280ms ease-out; }
      #boot-status[data-state="error"] { inset: 12px; color: #fff; border-color: #ff5970; opacity: 1; white-space: pre-wrap; }
      noscript { color: #dcf9ff; font: 16px system-ui; padding: 2rem; display: block; }
    </style>
  </head>
  <body>
    <canvas id="canvas-web"></canvas>
    <div id="boot-status"><strong>CANVAS / WASM</strong><span>STARTING DIRECT RENDERER</span></div>
    <script>
      const canvasFailure = (detail) => {
        const status = document.getElementById("boot-status");
        if (!status) return;
        status.dataset.state = "error";
        status.querySelector("span").textContent = `RUNTIME FAILURE · ${detail}`;
      };
      addEventListener("error", event => canvasFailure(event.message || "unknown error"));
      addEventListener("unhandledrejection", event => canvasFailure(String(event.reason || "unhandled rejection")));
    </script>
    <noscript>Canvas Web requires WebAssembly and JavaScript.</noscript>
  </body>
</html>
