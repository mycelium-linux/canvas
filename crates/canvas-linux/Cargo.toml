[package]
name = "canvas-linux"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["desktop", "mcp", "opencode"]
desktop = []
mcp = ["dep:rmcp", "dep:axum", "dep:tokio", "dep:subtle"]
opencode = ["dep:reqwest"]
compositor = ["dep:smithay"]

[dependencies]
canvas-core = { path = "../canvas-core" }
serde_json = "1"
libc = "0.2"
base64 = "0.22"
wayland-client = "0.31"
wayland-protocols-wlr = { version = "0.3", features = ["client"] }

serde = { version = "1", features = ["derive"] }
# `url` is a standalone URL parser (259 KB). `reqwest` is only pulled in when
# the OpenCode session integration is enabled; the desktop URL validation below
# does not need reqwest's HTTP stack at all.
url = "2.5"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json"], optional = true }
axum = { version = "0.8", optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "net", "signal"], optional = true }
rmcp = { version = "3.2", default-features = false, features = ["server", "transport-streamable-http-server"], optional = true }
subtle = { version = "2.6", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
smithay = { version = "0.7.0", optional = true, default-features = false, features = ["desktop", "wayland_frontend", "backend_drm", "backend_gbm", "backend_egl", "renderer_gl", "renderer_multi", "use_system_lib"] }
