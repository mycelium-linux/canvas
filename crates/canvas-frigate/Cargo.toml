[package]
name = "canvas-frigate"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Surface Frigate NVR camera streams as Canvas live_image frames (GPU video decode via ffmpeg/videotoolbox)"

[dependencies]
canvas-core = { workspace = true }
canvas = { workspace = true }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
unibus-media.workspace = true

[lib]
name = "canvas_frigate"
path = "src/lib.rs"

[[bin]]
name = "canvas-frigate"
path = "src/main.rs"

[[bin]]
name = "canvas-frigate-observer"
path = "src/bin/observer.rs"
