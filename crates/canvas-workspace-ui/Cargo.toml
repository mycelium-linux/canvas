[package]
name = "canvas-workspace-ui"
version = "0.1.0"
edition = "2024"
license = "LicenseRef-Proprietary"

[workspace]

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
egui = { version = "=0.33.3", default-features = false, features = ["default_fonts"] }
coherence-native = { path = "../../vendor/coherence-native", features = ["egui"] }
canvas-calendar = { path = "../canvas-calendar" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
web-time = "1"
eframe = { version = "=0.33.3", default-features = false, features = ["wgpu", "default_fonts", "x11", "wayland", "accesskit"], optional = true }
wgpu = { version = "27", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = { version = "=0.2.100", optional = true }
wasm-bindgen-futures = { version = "=0.4.50", optional = true }
web-sys = { version = "=0.3.77", features = ["HtmlCanvasElement"], optional = true }

[features]
default = []
native = ["dep:eframe", "eframe/persistence"]
web = ["dep:eframe", "eframe/persistence", "dep:wasm-bindgen", "dep:wasm-bindgen-futures", "dep:web-sys", "dep:wgpu", "wgpu/webgpu"]

[[bin]]
name = "canvas-workspace-demo"
path = "src/bin/demo.rs"
required-features = ["native"]

[profile.dev]
debug = 0
incremental = false
