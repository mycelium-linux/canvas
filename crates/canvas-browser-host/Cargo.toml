[package]
name = "canvas-browser-host"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Authenticated, engine-neutral browser worker pool for Canvas surfaces"

[dependencies]
anyhow.workspace = true
axum = "0.8"
base64 = "0.22"
canvas.workspace = true
canvas-core.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde.workspace = true
serde_json.workspace = true
subtle = "2.6"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal"] }
unibus-media = { path = "../../../unibus/crates/unibus-media" }

[dev-dependencies]
tempfile.workspace = true

[lib]
name = "canvas_browser_host"
path = "src/lib.rs"

[[bin]]
name = "canvas-browser-host"
path = "src/main.rs"
