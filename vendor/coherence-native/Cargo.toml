[package]
name = "coherence-native"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Coherence design-language adapters for independent native renderers"
license = "MIT"
repository = "https://github.com/FuturePresentLabs/coherence"
publish = false
readme = "README.md"

[dependencies]
coherence-tokens = { path = "../coherence-tokens", version = "0.2.3" }
fpl-gfx = { git = "https://github.com/ajmwagar/gfx.git", rev = "08cacbe245867d487f5ac1b44da9ae49d96e1890", default-features = false, optional = true }
egui = { version = "=0.33.3", default-features = false, optional = true }

[features]
default = []
gfx = ["dep:fpl-gfx"]
egui = ["dep:egui"]

[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"

[[example]]
name = "shared-theme"
required-features = ["gfx", "egui"]
