# Generated by dockctl desktop-theme from upstream Coherence.
$coherence_background = rgba(f5f6f7ff)
$coherence_surface = rgba(ffffffff)
$coherence_text = rgba(202329ff)
$coherence_border = rgba(d9dde3ff)
$coherence_accent = rgba(2449d8ff)
$coherence_gap = 8
$coherence_radius = 6
general {
    col.active_border = $coherence_accent
    col.inactive_border = $coherence_border
    gaps_in = $coherence_gap
    gaps_out = $coherence_gap
}
decoration {
    rounding = $coherence_radius
}
