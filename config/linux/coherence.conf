# Generated by dockctl desktop-theme from upstream Coherence.
$coherence_background = rgba(18191cff)
$coherence_surface = rgba(202226ff)
$coherence_text = rgba(f1f2f4ff)
$coherence_border = rgba(3b4048ff)
$coherence_accent = rgba(83cbdcff)
$coherence_gap = 8
$coherence_radius = 6
general {
    col.active_border = $coherence_accent
    col.inactive_border = $coherence_border
    gaps_in = $coherence_gap
    gaps_out = $coherence_gap
}
decoration {
    rounding = $coherence_radius
}
