# Dock nested Hyprland session. Theme is generated from the shared catalog.
source = ~/.config/dock/hypr/coherence.conf
monitor = , preferred, auto, 1
$dock = $HOME/.local/bin/dock-linux
$terminal = $dock hypr-terminal
$mod = ALT

general {
    gaps_in = $coherence_gap
    gaps_out = $coherence_gap
    border_size = 2
    col.active_border = $coherence_accent
    col.inactive_border = $coherence_border
    layout = dwindle
}
decoration {
    rounding = $coherence_radius
    blur {
        enabled = false
    }
    shadow {
        enabled = false
    }
}
animations {
    enabled = false
}
misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    force_default_wallpaper = 0
}
input {
    kb_layout = us
    follow_mouse = 1
}
dwindle {
    pseudotile = true
    preserve_split = true
}
# ALT avoids taking GNOME's Super shortcuts in this nested first cut.
bind = $mod, Return, exec, $terminal
bind = $mod, Q, killactive,
bind = $mod, F, fullscreen, 0
bind = $mod, H, movefocus, l
bind = $mod, J, movefocus, d
bind = $mod, K, movefocus, u
bind = $mod, L, movefocus, r
bind = $mod SHIFT, H, movewindow, l
bind = $mod SHIFT, J, movewindow, d
bind = $mod SHIFT, K, movewindow, u
bind = $mod SHIFT, L, movewindow, r
bind = $mod, 1, exec, $dock hypr-project dock
bind = $mod, 2, exec, $dock hypr-project studio
bind = $mod SHIFT, 1, movetoworkspacesilent, name:dock
bind = $mod SHIFT, 2, movetoworkspacesilent, name:studio
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow
