# Application-local configuration; do not replace the shared /etc/asound.conf.
</usr/share/alsa/alsa.conf>

pcm.tv_jack {
    type jack
    playback_ports {
        0 system:playback_1
        1 system:playback_2
    }
}

# Isochrone's native ALSA sink uses S32_LE; JACK ports are float PCM.
pcm.tv_slot {
    type plug
    slave.pcm "tv_jack"
}
