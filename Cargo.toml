[workspace]
members = ["crates/canvas", "crates/canvas-core", "crates/canvas-linux", "crates/canvas-mac", "crates/canvas-control", "crates/canvas-widgets"]
default-members = ["crates/canvas-core", "crates/canvas-linux", "crates/canvas-mac"]
exclude = ["vendor/coherence-tokens"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "LicenseRef-Proprietary"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
canvas-core = { path = "crates/canvas-core" }
canvas = { path = "crates/canvas" }
coherence-tokens = { path = "vendor/coherence-tokens" }
