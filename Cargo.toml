[workspace]
members = ["crates/canvas-workspace", "crates/canvas-browser-host", "crates/canvas-feeds", "crates/canvas-alfalfa", "crates/canvas-bifrost", "crates/canvas-dcp", "crates/canvas-eval", "crates/canvas-fab", "crates/canvas-shroud", "crates/canvas-frigate", "crates/canvas-media-edge", "crates/canvas-model-host", "crates/canvas-model-viewer", "crates/canvas-metrics", "crates/canvas-sse", "crates/canvas", "crates/canvas-core", "crates/canvas-linux", "crates/canvas-mac", "crates/canvas-control", "crates/canvas-web", "crates/canvas-widgets", "crates/canvas-survey", "crates/canvas-agents", "crates/canvas-agent-bridge"]
default-members = ["crates/canvas-core", "crates/canvas-linux", "crates/canvas-mac"]
exclude = ["vendor/coherence-tokens", "vendor/coherence-native", "vendor/iced_wgpu"]
resolver = "2"

[patch.crates-io]
iced_wgpu = { path = "vendor/iced_wgpu" }

# Local ecosystem development: one gfx identity for widgets and Coherence.
[patch."https://github.com/ajmwagar/gfx.git"]
fpl-gfx = { path = "../gfx" }

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "LicenseRef-Proprietary"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
canvas-core = { path = "crates/canvas-core" }
canvas = { path = "crates/canvas" }
fpl-gfx = { git = "https://github.com/ajmwagar/gfx.git", rev = "83b7d46593e892bc36fb0012d1d89cc850a0237c" }
coherence-native = { path = "vendor/coherence-native", default-features = false, features = ["gfx"] }
anyhow = "1"
axum = "0.8"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
dcp = { git = "https://github.com/FuturePresentLabs/dcp.git", rev = "d3a1335" }
tempfile = "3"
coherence-tokens = { path = "vendor/coherence-tokens" }
# The household bus contract, shared with JARVIS (dock marbles dock-pubd).
# One unibus, by sibling checkout. The expected revision is declared in
# [workspace.metadata.unibus] below and checked by scripts/ci-local.sh, so a
# bump stays deliberate and reviewable. It is deliberately NOT a git rev on the
# dependency: a git pin plus path dependencies on the same crates let cargo
# resolve two different revisions of one library, which is how the pin came to
# name a revision that has no crates/stream-descriptors at all.
unibus = { path = "../unibus/crates/unibus" }
unibus-device = { path = "../unibus/crates/unibus-device" }
unibus-media = { path = "../unibus/crates/unibus-media" }
unibus-sdk = { path = "../unibus/crates/unibus-sdk" }
soil-scene = { path = "../soil/crates/soil-scene" }
soil-input = { path = "../soil/crates/soil-input" }
soil-vt = { path = "../soil/crates/soil-vt" }
soil-layout = { path = "../soil/crates/soil-layout" }
stream-descriptors = { path = "../unibus/crates/stream-descriptors" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }

# Canvas runs directly from dev artifacts during local UI iteration. Keep the
# JPEG hot path representative of deployed performance without optimizing the
# entire workspace and slowing every edit/build cycle.
[profile.dev.package.image]
opt-level = 3

[profile.dev.package.zune-jpeg]
opt-level = 3

# The sibling revisions this workspace is expected to build against. Cargo does
# not read these; scripts/ci-local.sh does, so the bump is still a deliberate,
# reviewable line rather than an incidental one. They are metadata rather than
# dependency revs because every ecosystem crate resolves by path, and a git rev
# beside a path dependency on the same crate lets cargo pick two revisions.
[workspace.metadata.unibus]
rev = "a65388c03e802fc37e1025575cb0773a0339f63a"

[workspace.metadata.soil]
# Soil main after reverting the 3D node kinds (soil#23). Canvas keeps its own
# meshes, cameras and lights as groups in a Soil scene, so it needs no newer
# soil than this and must not be pinned to the revision that carried them.
rev = "5695fe92fd51a8fe67298b2eee3fda56619204fe"
