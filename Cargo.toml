[workspace]
members = ["crates/canvas-feeds", "crates/canvas-alfalfa", "crates/canvas-frigate", "crates/canvas-metrics", "crates/canvas-sse", "crates/canvas", "crates/canvas-core", "crates/canvas-linux", "crates/canvas-mac", "crates/canvas-control", "crates/canvas-widgets", "crates/canvas-survey", "crates/canvas-agents"]
default-members = ["crates/canvas-core", "crates/canvas-linux", "crates/canvas-mac"]
exclude = ["vendor/coherence-tokens"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "LicenseRef-Proprietary"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
canvas-core = { path = "crates/canvas-core" }
canvas = { path = "crates/canvas" }
anyhow = "1"
tempfile = "3"
coherence-tokens = { path = "vendor/coherence-tokens" }
# The household bus contract, shared with JARVIS (dock marbles dock-pubd).
# Pinned by rev; bump deliberately alongside unibus releases.
unibus = { git = "ssh://git@github.com/FuturePresentLabs/unibus.git", rev = "3819b9935afe96ce659153993725459181c5dbed" }
