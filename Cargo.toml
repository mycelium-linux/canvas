[workspace]
members = ["crates/canvas-browser-host", "crates/canvas-feeds", "crates/canvas-alfalfa", "crates/canvas-bifrost", "crates/canvas-eval", "crates/canvas-fab", "crates/canvas-shroud", "crates/canvas-frigate", "crates/canvas-media-edge", "crates/canvas-model-host", "crates/canvas-model-viewer", "crates/canvas-metrics", "crates/canvas-sse", "crates/canvas", "crates/canvas-core", "crates/canvas-linux", "crates/canvas-mac", "crates/canvas-control", "crates/canvas-web", "crates/canvas-widgets", "crates/canvas-survey", "crates/canvas-agents", "crates/canvas-agent-bridge", ]
default-members = ["crates/canvas-core", "crates/canvas-linux", "crates/canvas-mac"]
exclude = ["vendor/coherence-tokens"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "LicenseRef-Proprietary"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
canvas-core = { path = "crates/canvas-core" }
canvas = { path = "crates/canvas" }
anyhow = "1"
tempfile = "3"
coherence-tokens = { path = "vendor/coherence-tokens" }
# The household bus contract, shared with JARVIS (dock marbles dock-pubd).
# Pinned by rev; bump deliberately alongside unibus releases.
unibus = { git = "ssh://git@github.com/FuturePresentLabs/unibus.git", rev = "b47a6cc15a6246296ac34136d513533d21dd11c1" }

# Canvas runs directly from dev artifacts during local UI iteration. Keep the
# JPEG hot path representative of deployed performance without optimizing the
# entire workspace and slowing every edit/build cycle.
[profile.dev.package.image]
opt-level = 3

[profile.dev.package.zune-jpeg]
opt-level = 3
