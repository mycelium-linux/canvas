[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fpl-dock"
version = "0.1.0"
description = "Shared project profiles and Coherence artifacts for Dock"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
dock = "dock.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
