[workspace]

[package]
name = "blitz-html-spike"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
blitz-html = "=0.3.0-beta.2"
blitz-dom = "=0.3.0-beta.2"
blitz-traits = "=0.3.0-beta.2"
blitz-paint = "=0.3.0-beta.2"
anyrender = "0.13"
anyrender_vello_cpu = "0.17"
tera = "1"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
mlua = { version = "0.12.1", features = ["luau", "serialize"] }
canvas-core = { path = "../../crates/canvas-core" }

# vello_cpu is a software rasteriser; unoptimised deps make timings meaningless
# and the render unusably slow. Optimise deps, keep the spike crate itself cheap.
[profile.dev]
opt-level = 1
debug = false

[profile.dev.package."*"]
opt-level = 2
debug = false
