[package]
name = "blitz-html-spike"
version = "0.1.0"
edition = "2021"
publish = false

# Detach from the enclosing Canvas workspace. This spike is standalone.
[workspace]

[dependencies]
blitz-dom = "=0.3.0-beta.2"
blitz-html = "=0.3.0-beta.2"
blitz-paint = "=0.3.0-beta.2"
blitz-traits = "=0.3.0-beta.2"
anyrender = "0.13"
anyrender_vello_cpu = "0.17"
tera = "1"
serde_json = "1"
png = "0.17"

[profile.dev]
opt-level = 1
debug = false

# vello_cpu is a software rasteriser; unoptimised deps make the timings
# meaningless. Optimise dependencies, keep the spike crate itself cheap.
[profile.dev.package."*"]
opt-level = 2
debug = false
