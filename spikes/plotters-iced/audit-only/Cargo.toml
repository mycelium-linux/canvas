# Same spec/render/audit code as the GUI crate, minus iced. Exists so the Lua
# and primitive-count evidence does not sit behind a wgpu compile.
[package]
name = "spike-plotters-audit"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
plotters = { version = "0.3", default-features = false, features = [
    "line_series",
    "point_series",
    "area_series",
] }
plotters-backend = "0.3"
mlua = { version = "0.12.1", features = ["luau", "serialize"] }
