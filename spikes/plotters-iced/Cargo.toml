# Standalone spike crate. The empty [workspace] table detaches it from the
# repo workspace so `cargo build --workspace` at the root never absorbs it.
[workspace]

[package]
name = "plotters-iced-spike"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
# NOTE: plotters-iced (the original) has NO iced 0.14 release. This is the
# maintained fork, plotters-iced2 0.14.0, published 2025-12-29.
plotters-iced2 = "0.14"
plotters = { version = "0.3", default-features = false, features = [
    "line_series",
    "area_series",
    "point_series",
] }
# Same feature set Canvas uses, minus the ones irrelevant to a chart spike.
iced = { version = "0.14", default-features = false, features = ["wgpu", "canvas"] }
# Matches crates/canvas/Cargo.toml:21 exactly.
mlua = { version = "0.12.1", features = ["luau"] }

[[bin]]
name = "spike"
path = "src/main.rs"
